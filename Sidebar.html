<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* ============================================
       MJ Prompt Factory — BRUTALIST PASTEL UI
       Raw · Functional · Beautiful
       ============================================ */
    
    :root {
      --bg: #FAF7F2;
      --bg-card: #FFFFFF;
      --bg-hover: #F0ECE4;
      --bg-input: #F5F1EA;
      --text: #1a1a1a;
      --text-dim: #555555;
      --text-muted: #999999;
      --accent: #B8A9E8;
      --accent-dark: #7B68AE;
      --mint: #A8E6CF;
      --peach: #FFB7B2;
      --lemon: #FFDAB9;
      --sky: #B5D8F7;
      --success: #A8E6CF;
      --warning: #FFDAB9;
      --error: #FFB7B2;
      --border: #1a1a1a;
      --border-w: 2px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Courier New', 'Consolas', monospace;
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
      line-height: 1.6;
      overflow-x: hidden;
      padding: 0;
    }

    /* Layout */
    .container {
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 100vh;
      max-width: 520px;
      margin: 0 auto;
    }

    /* Web App responsive mode */
    @media (min-width: 400px) {
      body { font-size: 13px; }
      .container { padding: 24px 20px; gap: 14px; }
      .header h1 { font-size: 20px; }
      .prompt-text { font-size: 13px; max-height: 260px; }
      .btn { padding: 12px 10px; font-size: 12px; }
    }

    /* Header */
    .header {
      text-align: left;
      padding: 10px 12px;
      border: var(--border-w) solid var(--border);
      background: var(--accent);
    }
    .header h1 {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text);
    }
    .header .sub {
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 2px;
    }

    /* Progress Bar */
    .progress-section {
      background: var(--bg-card);
      padding: 10px 12px;
      border: var(--border-w) solid var(--border);
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-dim);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }
    .progress-track {
      height: 10px;
      background: var(--bg);
      border: var(--border-w) solid var(--border);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--mint);
      transition: width 0.4s ease;
    }
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-top: 8px;
    }
    .stat {
      font-size: 10px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .stat-dot {
      width: 8px;
      height: 8px;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }
    .stat-dot.pending { background: var(--lemon); }
    .stat-dot.copied { background: var(--sky); }
    .stat-dot.done { background: var(--mint); }
    .stat-dot.skipped { background: var(--peach); }

    /* Prompt Card */
    .prompt-card {
      background: var(--bg-card);
      border: var(--border-w) solid var(--border);
      padding: 12px;
      position: relative;
    }
    .prompt-card.active {
      border-width: 3px;
      box-shadow: 4px 4px 0 var(--border);
    }
    .prompt-number {
      font-size: 10px;
      color: var(--accent-dark);
      font-weight: 900;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      background: var(--lemon);
      display: inline-block;
      padding: 1px 6px;
      border: 1px solid var(--border);
    }
    .prompt-text {
      font-size: 12px;
      line-height: 1.8;
      color: var(--text);
      max-height: 160px;
      overflow-y: auto;
      word-break: break-word;
      padding: 8px;
      background: var(--bg-input);
      border: 1px solid #ddd;
      margin-top: 6px;
      font-family: 'Segoe UI', sans-serif;
    }
    .prompt-text::-webkit-scrollbar { width: 4px; }
    .prompt-text::-webkit-scrollbar-thumb { background: var(--border); }
    .prompt-meta {
      margin-top: 8px;
      font-size: 9px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }
    .empty-state {
      text-align: center;
      padding: 20px 10px;
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.6;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 4px;
    }
    .btn {
      flex: 1;
      padding: 9px 6px;
      border: var(--border-w) solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.1s ease;
      text-align: center;
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .btn:hover {
      background: var(--bg-hover);
      box-shadow: 2px 2px 0 var(--border);
      transform: translate(-1px, -1px);
    }
    .btn:active {
      transform: translate(1px, 1px);
      box-shadow: none;
    }
    .btn-primary {
      background: var(--accent);
      color: var(--text);
      font-weight: 900;
      box-shadow: 3px 3px 0 var(--border);
    }
    .btn-primary:hover {
      background: #C7BBF0;
      box-shadow: 4px 4px 0 var(--border);
      transform: translate(-1px, -1px);
    }
    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .btn-success {
      background: var(--mint);
      color: var(--text);
    }
    .btn-small {
      padding: 5px 8px;
      font-size: 10px;
    }

    /* Sections (collapsible) */
    .panel {
      background: var(--bg-card);
      border: var(--border-w) solid var(--border);
      overflow: hidden;
    }
    .panel-header {
      padding: 9px 12px;
      font-size: 11px;
      font-weight: 900;
      color: var(--text);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.1s;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: var(--bg);
    }
    .panel-header:hover { background: var(--bg-hover); }
    .panel-header .arrow {
      transition: transform 0.2s;
      font-size: 10px;
      font-weight: 900;
    }
    .panel-header.open .arrow { transform: rotate(90deg); }
    .panel-body {
      display: none;
      padding: 10px 12px;
      border-top: var(--border-w) solid var(--border);
    }
    .panel-body.open { display: block; }

    /* Form Elements */
    select, input[type="text"], input[type="number"], input[type="password"] {
      width: 100%;
      padding: 7px 8px;
      background: var(--bg-input);
      border: var(--border-w) solid var(--border);
      color: var(--text);
      font-size: 11px;
      font-family: inherit;
      margin-top: 5px;
    }
    select:focus, input:focus {
      outline: none;
      background: #fff;
      box-shadow: 2px 2px 0 var(--accent);
    }
    label {
      font-size: 10px;
      color: var(--text-dim);
      font-weight: 900;
      display: block;
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    label:first-child { margin-top: 0; }
    textarea {
      width: 100%;
      padding: 7px 8px;
      background: var(--bg-input);
      border: var(--border-w) solid var(--border);
      color: var(--text);
      font-size: 11px;
      font-family: inherit;
      margin-top: 5px;
      resize: vertical;
      min-height: 55px;
    }
    textarea:focus {
      outline: none;
      background: #fff;
      box-shadow: 2px 2px 0 var(--accent);
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%) translateY(-60px);
      background: var(--bg-card);
      border: var(--border-w) solid var(--border);
      color: var(--text);
      padding: 7px 14px;
      font-size: 11px;
      font-weight: 700;
      z-index: 999;
      opacity: 0;
      transition: all 0.2s ease;
      white-space: nowrap;
      box-shadow: 3px 3px 0 var(--border);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast.error {
      background: var(--peach);
    }

    /* Keyboard hint */
    .kbd-hints {
      text-align: center;
      font-size: 9px;
      color: var(--text-muted);
      padding: 6px 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    kbd {
      display: inline-block;
      padding: 1px 4px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-family: inherit;
      font-size: 9px;
      font-weight: 700;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.1em;
    }
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>MJ Prompt Factory</h1>
      <div class="sub">Midjourney V7 Batch Manager</div>
    </div>

    <!-- Progress -->
    <div class="progress-section">
      <div class="progress-label">
        <span id="progress-label">Queue</span>
        <span id="progress-count">0/0</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
      </div>
      <div class="stats-row">
        <div class="stat"><div class="stat-dot pending"></div><span id="stat-pending">0 대기</span></div>
        <div class="stat"><div class="stat-dot copied"></div><span id="stat-copied">0 복사</span></div>
        <div class="stat"><div class="stat-dot done"></div><span id="stat-done">0 완료</span></div>
        <div class="stat"><div class="stat-dot skipped"></div><span id="stat-skipped">0 스킵</span></div>
      </div>
    </div>

    <!-- Prompt Card -->
    <div class="prompt-card active" id="prompt-card">
      <div class="loading" id="loading-state">
        <div class="spinner"></div>
        <div style="margin-top: 8px;">로딩 중...</div>
      </div>
      <div id="prompt-content" style="display:none;">
        <div class="prompt-number" id="prompt-number">#1</div>
        <div class="prompt-text" id="prompt-text"></div>
        <div class="prompt-meta">
          <span id="prompt-chars">0 chars</span>
          <span id="prompt-status">대기</span>
        </div>
      </div>
      <div class="empty-state" id="empty-state" style="display:none;">
        큐가 비어있습니다.<br>
        아래 Generate 패널에서 프롬프트를 생성하세요.
      </div>
    </div>

    <!-- Navigation Buttons -->
    <div class="btn-row">
      <button class="btn" id="btn-prev" onclick="navigate(-1)">Prev</button>
      <button class="btn btn-primary" id="btn-copy" onclick="copyAndNext()">COPY</button>
      <button class="btn" id="btn-next" onclick="navigate(1)">Next</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-small" id="btn-skip" onclick="skip()">Skip</button>
      <button class="btn btn-small btn-success" id="btn-done" onclick="markAsDone()">Mark Done</button>
    </div>

    <!-- Keyboard hints -->
    <div class="kbd-hints">
      <kbd>Space</kbd> Copy &nbsp; <kbd>&#8592;&#8594;</kbd> Navigate &nbsp; <kbd>S</kbd> Skip &nbsp; <kbd>D</kbd> Done
    </div>

    <!-- Generate Panel -->
    <div class="panel">
      <div class="panel-header" onclick="togglePanel(this)">
        Generate Prompts <span class="arrow">&#9654;</span>
      </div>
      <div class="panel-body" id="generate-panel">
        <label>Template</label>
        <select id="template-select">
          <option value="">-- Select --</option>
        </select>
        
        <label>Mode</label>
        <select id="gen-mode">
          <option value="cartesian">Cartesian (All Combos)</option>
          <option value="oneToOne">1:1 Matching</option>
          <option value="random">Random N</option>
        </select>
        
        <div id="random-n-row" style="display:none;">
          <label>Count</label>
          <input type="number" id="random-n" value="10" min="1" max="500">
        </div>
        
        <button class="btn btn-primary" style="width:100%; margin-top:12px;" onclick="generatePrompts()">
          Generate
        </button>
      </div>
    </div>

    <!-- AI Panel -->
    <div class="panel">
      <div class="panel-header" onclick="togglePanel(this)">
        AI Prompt Expand <span class="arrow">&#9654;</span>
      </div>
      <div class="panel-body" id="ai-panel">
        <label>AI Provider</label>
        <select id="ai-provider">
          <option value="claude">Claude (Anthropic)</option>
          <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
          <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
        </select>

        <label>Concept (Korean)</label>
        <textarea id="ai-concept" placeholder="예: 네온 도시를 걷는 사이버펑크 고양이"></textarea>
        
        <label>Variations</label>
        <input type="number" id="ai-count" value="5" min="1" max="20">
        
        <button class="btn btn-primary" style="width:100%; margin-top:12px;" id="btn-ai-expand" onclick="aiExpand()">
          Expand
        </button>
        
        <div id="claude-key-notice" style="display:none; margin-top:10px;">
          <label>Claude API Key (sk-ant-...)</label>
          <input type="password" id="claude-key-input" placeholder="Anthropic API Key">
          <button class="btn btn-small" style="width:100%; margin-top:6px;" onclick="saveClaudeKey()">Save Claude Key</button>
        </div>
        <div id="gemini-key-notice" style="display:none; margin-top:10px;">
          <label>Gemini API Key</label>
          <input type="password" id="gemini-key-input" placeholder="Google AI Studio Key">
          <button class="btn btn-small" style="width:100%; margin-top:6px;" onclick="saveGeminiKey()">Save Gemini Key</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // ============================================
    // State
    // ============================================
    let state = {
      currentIndex: -1,
      total: 0,
      stats: { pending: 0, copied: 0, done: 0, skipped: 0 },
      isLoading: false,
    };

    // ============================================
    // Init
    // ============================================
    document.addEventListener('DOMContentLoaded', function() {
      google.script.run
        .withSuccessHandler(onInitData)
        .withFailureHandler(onError)
        .getSidebarInitData();
    });

    function onInitData(data) {
      state.stats = data.stats;
      state.total = data.stats.total;
      state.currentIndex = data.currentIndex;
      
      updateStatsUI();
      
      if (data.currentPrompt) {
        showPrompt(data.currentPrompt);
      } else {
        showEmpty();
      }
      
      // Populate templates
      var sel = document.getElementById('template-select');
      (data.templates || []).forEach(function(t) {
        var opt = document.createElement('option');
        opt.value = t.index;
        opt.textContent = t.name;
        sel.appendChild(opt);
      });
      
      // Show API key notices if not set
      if (!data.apiKeySet) {
        document.getElementById('claude-key-notice').style.display = 'block';
      }
      if (!data.geminiApiKeySet) {
        document.getElementById('gemini-key-notice').style.display = 'block';
      }
      
      document.getElementById('loading-state').style.display = 'none';
    }

    // ============================================
    // Display
    // ============================================
    function showPrompt(data) {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('prompt-content').style.display = 'block';
      document.getElementById('empty-state').style.display = 'none';
      
      document.getElementById('prompt-number').textContent = '#' + data.number;
      document.getElementById('prompt-text').textContent = data.prompt;
      document.getElementById('prompt-chars').textContent = data.charCount + ' chars';
      document.getElementById('prompt-status').textContent = data.status;
    }

    function showEmpty() {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('prompt-content').style.display = 'none';
      document.getElementById('empty-state').style.display = 'block';
    }

    function updateStatsUI() {
      var s = state.stats;
      var done = s.done + s.copied;
      var total = s.total || 1;
      var pct = Math.round((done / total) * 100);
      
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('progress-count').textContent = done + '/' + s.total;
      document.getElementById('stat-pending').textContent = s.pending + ' 대기';
      document.getElementById('stat-copied').textContent = s.copied + ' 복사';
      document.getElementById('stat-done').textContent = s.done + ' 완료';
      document.getElementById('stat-skipped').textContent = s.skipped + ' 스킵';
    }

    function setLoading(loading) {
      state.isLoading = loading;
      document.getElementById('btn-copy').disabled = loading;
    }

    // ============================================
    // Actions
    // ============================================
    function copyAndNext() {
      if (state.currentIndex < 0 || state.isLoading) return;
      
      // Copy to clipboard
      var text = document.getElementById('prompt-text').textContent;
      navigator.clipboard.writeText(text).then(function() {
        showToast('Copied!');
      }).catch(function() {
        // Fallback
        var ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('Copied!');
      });
      
      // Update server
      setLoading(true);
      google.script.run
        .withSuccessHandler(function(result) {
          state.stats = result.stats;
          updateStatsUI();
          
          if (result.nextPrompt) {
            state.currentIndex = result.nextIndex;
            showPrompt(result.nextPrompt);
          } else {
            state.currentIndex = -1;
            showEmpty();
            showToast('All prompts processed!');
          }
          setLoading(false);
        })
        .withFailureHandler(function(err) {
          onError(err);
          setLoading(false);
        })
        .copyAndNext(state.currentIndex);
    }

    function navigate(direction) {
      if (state.isLoading) return;
      var newIndex = state.currentIndex + direction;
      if (newIndex < 0) newIndex = state.total - 1;
      if (newIndex >= state.total) newIndex = 0;
      
      setLoading(true);
      google.script.run
        .withSuccessHandler(function(data) {
          if (data) {
            state.currentIndex = data.index;
            showPrompt(data);
          }
          setLoading(false);
        })
        .withFailureHandler(function(err) {
          onError(err);
          setLoading(false);
        })
        .getPromptAt(newIndex);
    }

    function skip() {
      if (state.currentIndex < 0 || state.isLoading) return;
      setLoading(true);
      google.script.run
        .withSuccessHandler(function(result) {
          state.stats = result.stats;
          updateStatsUI();
          if (result.nextPrompt) {
            state.currentIndex = result.nextIndex;
            showPrompt(result.nextPrompt);
          } else {
            state.currentIndex = -1;
            showEmpty();
          }
          setLoading(false);
          showToast('Skipped');
        })
        .withFailureHandler(function(err) {
          onError(err);
          setLoading(false);
        })
        .skipPrompt(state.currentIndex);
    }

    function markAsDone() {
      if (state.currentIndex < 0 || state.isLoading) return;
      setLoading(true);
      google.script.run
        .withSuccessHandler(function(stats) {
          state.stats = stats;
          updateStatsUI();
          showToast('Marked as done');
          // Move to next pending
          navigate(1);
        })
        .withFailureHandler(onError)
        .markDone(state.currentIndex);
    }

    // ============================================
    // Generate
    // ============================================
    function generatePrompts() {
      var templateIndex = parseInt(document.getElementById('template-select').value);
      var mode = document.getElementById('gen-mode').value;
      var randomN = parseInt(document.getElementById('random-n').value) || 10;
      
      if (!templateIndex) {
        showToast('Select a template first', true);
        return;
      }
      
      setLoading(true);
      showToast('Generating...');
      
      google.script.run
        .withSuccessHandler(function(result) {
          showToast(result.count + ' prompts generated!');
          // Reload sidebar data
          google.script.run
            .withSuccessHandler(onInitData)
            .getSidebarInitData();
        })
        .withFailureHandler(function(err) {
          onError(err);
          setLoading(false);
        })
        .generateFromSidebar(templateIndex, mode, randomN);
    }

    // ============================================
    // AI Expand
    // ============================================
    function aiExpand() {
      var concept = document.getElementById('ai-concept').value.trim();
      var count = parseInt(document.getElementById('ai-count').value) || 5;
      var provider = document.getElementById('ai-provider').value;
      
      if (!concept) {
        showToast('Enter a concept first', true);
        return;
      }
      
      var btn = document.getElementById('btn-ai-expand');
      btn.disabled = true;
      btn.textContent = 'Generating...';
      
      var providerLabel = provider === 'claude' ? 'Claude' : 'Gemini';
      
      if (provider === 'claude') {
        // Use Claude
        google.script.run
          .withSuccessHandler(function(result) {
            showToast(result.count + ' AI prompts added!');
            btn.disabled = false;
            btn.textContent = 'Expand';
            document.getElementById('ai-concept').value = '';
            google.script.run.withSuccessHandler(onInitData).getSidebarInitData();
          })
          .withFailureHandler(function(err) {
            btn.disabled = false;
            btn.textContent = 'Expand';
            onError(err);
          })
          .expandFromSidebar(concept, count);
      } else {
        // Use Gemini
        google.script.run
          .withSuccessHandler(function(result) {
            showToast(result.count + ' AI prompts added!');
            btn.disabled = false;
            btn.textContent = 'Expand';
            document.getElementById('ai-concept').value = '';
            google.script.run.withSuccessHandler(onInitData).getSidebarInitData();
          })
          .withFailureHandler(function(err) {
            btn.disabled = false;
            btn.textContent = 'Expand';
            onError(err);
          })
          .expandFromSidebarGemini(concept, count, provider);
      }
    }

    function saveClaudeKey() {
      var key = document.getElementById('claude-key-input').value.trim();
      if (!key) return;
      
      google.script.run
        .withSuccessHandler(function() {
          showToast('Claude API key saved!');
          document.getElementById('claude-key-notice').style.display = 'none';
        })
        .withFailureHandler(onError)
        .saveApiKey(key);
    }

    function saveGeminiKey() {
      var key = document.getElementById('gemini-key-input').value.trim();
      if (!key) return;
      
      google.script.run
        .withSuccessHandler(function() {
          showToast('Gemini API key saved!');
          document.getElementById('gemini-key-notice').style.display = 'none';
        })
        .withFailureHandler(onError)
        .saveGeminiApiKey(key);
    }

    // ============================================
    // Panel Toggle
    // ============================================
    function togglePanel(header) {
      header.classList.toggle('open');
      var body = header.nextElementSibling;
      body.classList.toggle('open');
    }

    // Show/hide random N input
    document.getElementById('gen-mode').addEventListener('change', function() {
      document.getElementById('random-n-row').style.display =
        this.value === 'random' ? 'block' : 'none';
    });

    // ============================================
    // Keyboard Shortcuts
    // ============================================
    document.addEventListener('keydown', function(e) {
      // Ignore if typing in input/textarea
      var tag = e.target.tagName.toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
      
      switch (e.code) {
        case 'Space':
          e.preventDefault();
          copyAndNext();
          break;
        case 'ArrowLeft':
          e.preventDefault();
          navigate(-1);
          break;
        case 'ArrowRight':
          e.preventDefault();
          navigate(1);
          break;
        case 'KeyS':
          e.preventDefault();
          skip();
          break;
        case 'KeyD':
          e.preventDefault();
          markAsDone();
          break;
      }
    });

    // ============================================
    // Toast
    // ============================================
    var toastTimeout;
    function showToast(msg, isError) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (isError ? ' error' : '');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(function() {
        t.className = 'toast';
      }, 2000);
    }

    function onError(err) {
      showToast(err.message || 'An error occurred', true);
      setLoading(false);
    }
  </script>
</body>
</html>
